name: Sandboxed execution
description: "Runs repository-controlled code (project tooling, plugins, build scripts) inside a bubblewrap sandbox: no network, read-only source, scrubbed environment, single writable output dir, CPU/memory/pid/time limits. The results dir, depot, GITHUB_* env and tokens are not visible inside. Output is DATA; the caller normalises it afterwards."
inputs:
  source_path: { description: Directory mounted read-only at /work, required: true }
  out_path: { description: Directory mounted read-write at /out (created empty), required: true }
  ro_mounts: { description: "Space-separated host:mount pairs mounted read-only (toolchains)", default: "" }
  command: { description: Command line executed inside the sandbox (via /bin/sh -c), required: true }
  timeout_s: { description: "Positive timeout in seconds (1–86400)", default: "900" }
  mem_mb: { description: "Positive memory limit in MiB (1–262144)", default: "4096" }
outputs:
  rc: { value: "${{ steps.run.outputs.rc }}" }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        command -v bwrap >/dev/null || { sudo apt-get install -y -qq bubblewrap >/dev/null 2>&1 || true; }
        # Ubuntu 24.04 runners restrict unprivileged user namespaces for unconfined binaries; bwrap ships an AppArmor profile, but enable explicitly if the self-test fails.
        if ! bwrap --unshare-all --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /bin/true 2>/dev/null; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          bwrap --unshare-all --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /bin/true || { echo "::error::sandbox unavailable on this runner"; exit 125; }
        fi
    - id: run
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_MEM_MB: ${{ inputs.mem_mb }}
        INPUT_OUT_PATH: ${{ inputs.out_path }}
        INPUT_RO_MOUNTS: ${{ inputs.ro_mounts }}
        INPUT_SOURCE_PATH: ${{ inputs.source_path }}
        INPUT_TIMEOUT_S: ${{ inputs.timeout_s }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        [[ "$INPUT_TIMEOUT_S" =~ ^[1-9][0-9]{0,4}$ ]] && (( INPUT_TIMEOUT_S <= 86400 )) || { echo "::error::invalid timeout"; exit 2; }
        [[ "$INPUT_MEM_MB" =~ ^[1-9][0-9]{0,5}$ ]] && (( INPUT_MEM_MB <= 262144 )) || { echo "::error::invalid memory limit"; exit 2; }
        [ -n "$INPUT_SOURCE_PATH" ] && [ -n "$INPUT_OUT_PATH" ] || exit 2
        rm -rf -- "$INPUT_OUT_PATH"; mkdir -p -- "$INPUT_OUT_PATH"
        RO=(); MOUNTS=(); read -r -d '' -a MOUNTS <<< "$INPUT_RO_MOUNTS" || true
        for m in "${MOUNTS[@]}"; do RO+=(--ro "$m"); done
        set +e
        "$ACTION_PATH/../../scripts/sandbox_exec.sh" --src "$INPUT_SOURCE_PATH" --out "$INPUT_OUT_PATH" "${RO[@]}" --timeout "$INPUT_TIMEOUT_S" --mem-mb "$INPUT_MEM_MB" -- /bin/sh -c "$INPUT_COMMAND"
        echo "rc=$?" >> "$GITHUB_OUTPUT"

name: DAST — OWASP ZAP baseline
description: Fail-closed applicability record until an allowed, qualified ZAP runner is installed.
inputs:
  target_url: { description: Authorized target (empty = not applicable), default: "" }
  authorization_ref: { description: Approval reference for an isolated non-production target, default: "" }
  web_app_detected: { description: Whether a web framework was detected, default: "false" }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TARGET_URL: ${{ inputs.target_url }}
        AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
        WEB_APP_DETECTED: ${{ inputs.web_app_detected }}
      run: |
        set -euo pipefail
        S="${{ github.action_path }}/../../scripts"
        if [ -z "$TARGET_URL" ] && [ "$WEB_APP_DETECTED" != "true" ]; then
          python3 "$S/result.py" --control DAST-ZAP --domain B --status NOT_APPLICABLE --reason "no web application framework detected and no target supplied" --tool zap
        elif [ -z "$TARGET_URL" ]; then
          python3 "$S/result.py" --control DAST-ZAP --domain B --status POLICY_UNAVAILABLE --reason "web application detected but no authorized isolated DAST target was supplied; dynamic testing did not run" --tool zap
        elif [ -z "$AUTHORIZATION_REF" ]; then
          python3 "$S/result.py" --control DAST-ZAP --domain B --status POLICY_UNAVAILABLE --reason "target supplied without authorization reference; refusing to scan an unapproved host" --tool zap
        else
          python3 "$S/result.py" --control DAST-ZAP --domain B --status POLICY_UNAVAILABLE --reason "ZAP runner unavailable: third-party action is prohibited by caller Actions policy; no qualified allowed replacement has been installed; no scan performed" --tool zap
        fi

name: Attest release
description: >-
  Keyless signing with the job's GitHub OIDC identity. cosign sign-blob writes Sigstore
  bundles for release.zip and release.meta.json and verifies them against the expected
  certificate identity (https://github.com/<builder.workflow>); a mismatch between the
  manifest's builder and the real job_workflow_ref fails here. Every targets/*.zip is
  covered through its digest in the signed release.meta.json. GitHub artifact attestations
  are not used. Requires id-token: write.
inputs:
  release_dir:
    description: Verified release directory
    required: true
  builder_workflow:
    description: builder.workflow from release.meta.json (verify-release output)
    required: true
outputs:
  certificate_identity:
    description: Certificate identity the signatures were verified against
    value: ${{ steps.identity.outputs.certificate_identity }}
runs:
  using: composite
  steps:
    - id: identity
      shell: bash
      env:
        RELEASE_DIR: ${{ inputs.release_dir }}
        BUILDER: ${{ inputs.builder_workflow }}
      run: |
        set -euo pipefail
        [[ "$BUILDER" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/\.github/workflows/release\.yml@[0-9a-f]{40}$ ]] || { echo "::error::builder workflow must be a SHA-pinned release.yml"; exit 1; }
        for out in release.zip.sigstore.json release.meta.json.sigstore.json; do
          test ! -e "$RELEASE_DIR/$out" || { echo "::error::$out already exists"; exit 1; }
        done
        printf 'certificate_identity=https://github.com/%s\n' "$BUILDER" >> "$GITHUB_OUTPUT"
    # cosign from the security-assurance tool registry (SHA-256 pinned, fail closed), not a
    # third-party action: callers' Actions policy allows only owner and GitHub actions.
    - uses: ./.depot/security-assurance/.github/actions/install-tool
      with:
        tool: cosign
    - name: Sign and verify release.zip and release.meta.json
      shell: bash
      env:
        RELEASE_DIR: ${{ inputs.release_dir }}
        IDENTITY: ${{ steps.identity.outputs.certificate_identity }}
      run: |
        set -euo pipefail
        for file in release.zip release.meta.json; do
          cosign sign-blob --yes --bundle "$RELEASE_DIR/$file.sigstore.json" "$RELEASE_DIR/$file"
          cosign verify-blob --bundle "$RELEASE_DIR/$file.sigstore.json" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$RELEASE_DIR/$file"
        done

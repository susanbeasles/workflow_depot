name: Write authorization policy
description: >-
  Writes authorization-policy.json (authorization-policy/v1) binding the application,
  release tag, source commit and the SHA-pinned release workflow signer. The expiry is
  derived from the source commit time so the release stays reproducible.
inputs:
  app_path:
    description: Application checkout (used only to read the commit timestamp)
    required: true
  application_path:
    description: Validated application manifest
    required: true
  context_path:
    description: release-context/v1 file
    required: true
  depot_repository:
    description: owner/repo of this depot
    required: true
  depot_sha:
    description: Full commit SHA of this depot (the signer workflow revision)
    required: true
  release_dir:
    description: Release output directory
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../../ci/release
        APP_PATH: ${{ inputs.app_path }}
        APPLICATION_PATH: ${{ inputs.application_path }}
        CONTEXT_PATH: ${{ inputs.context_path }}
        DEPOT_REPOSITORY: ${{ inputs.depot_repository }}
        DEPOT_SHA: ${{ inputs.depot_sha }}
        RELEASE_DIR: ${{ inputs.release_dir }}
      run: |
        set -euo pipefail
        epoch="$(git -C "$APP_PATH" log -1 --format=%ct "$GITHUB_SHA")"
        [[ "$epoch" =~ ^[1-9][0-9]{0,11}$ ]] || { echo "::error::could not read the source commit time"; exit 1; }
        node "$SCRIPTS/write-authorization-policy.mjs" --application "$APPLICATION_PATH" --context "$CONTEXT_PATH" \
          --depot-repository "$DEPOT_REPOSITORY" --depot-sha "$DEPOT_SHA" --source-date-epoch "$epoch" --out-dir "$RELEASE_DIR"

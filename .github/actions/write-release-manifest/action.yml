name: Write release manifest
description: >-
  Writes release.meta.json (release-manifest/v2, canonical JSON) beside release.zip.
  builder.workflow is <depot_repository>/.github/workflows/release.yml@<depot_sha>, the
  job_workflow_ref that becomes the Fulcio certificate identity when attest-release signs.
inputs:
  release_dir:
    description: Release output directory
    required: true
  application_path:
    description: Validated application manifest
    required: true
  context_path:
    description: release-context/v1 file
    required: true
  depot_repository:
    description: owner/repo of this depot
    required: true
  depot_sha:
    description: Full commit SHA of this depot
    required: true
outputs:
  manifest_sha256:
    description: sha256 of release.meta.json (equals its canonical digest)
    value: ${{ steps.manifest.outputs.manifest_sha256 }}
runs:
  using: composite
  steps:
    - id: manifest
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../../ci/release
        RELEASE_DIR: ${{ inputs.release_dir }}
        APPLICATION_PATH: ${{ inputs.application_path }}
        CONTEXT_PATH: ${{ inputs.context_path }}
        DEPOT_REPOSITORY: ${{ inputs.depot_repository }}
        DEPOT_SHA: ${{ inputs.depot_sha }}
      run: |
        set -euo pipefail
        node "$SCRIPTS/write-release-manifest.mjs" --release-dir "$RELEASE_DIR" --application "$APPLICATION_PATH" --context "$CONTEXT_PATH" \
          --depot-repository "$DEPOT_REPOSITORY" --depot-sha "$DEPOT_SHA" --github-output "$GITHUB_OUTPUT"

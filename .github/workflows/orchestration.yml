name: Candidate application checks

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      package_manager:
        type: string
        default: npm
      setup_script:
        type: string
        default: setup:ci
      environment_paths:
        description: JSON list of repository-relative environment directories
        required: true
        type: string
      unit_shards:
        type: number
        default: 1
      integration_shards:
        type: number
        default: 1
      e2e_shards:
        type: number
        default: 1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - id: contract
        name: Validate source and app contract
        env:
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_OWNER_ID: ${{ github.repository_owner_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          SETUP_SCRIPT: ${{ inputs.setup_script }}
          ENVIRONMENT_PATHS: ${{ inputs.environment_paths }}
          UNIT_SHARDS: ${{ inputs.unit_shards }}
          INTEGRATION_SHARDS: ${{ inputs.integration_shards }}
          E2E_SHARDS: ${{ inputs.e2e_shards }}
        run: |
          node --input-type=module <<'JS'
          // contract: validate
          const {appendFileSync}=await import('node:fs');
          const e=process.env;
          const shadow=/^refs\/heads\/int\/([A-Za-z0-9_./-]+)$/.exec(e.SOURCE_REF??'');
          if(e.SOURCE_EVENT!=='push'||!shadow||e.SOURCE_OWNER_ID!=='215839550'||!/^susanbeasles\/[A-Za-z0-9_.-]+$/.test(e.SOURCE_REPOSITORY??'')) throw Error('Candidate must be a personal signed shadow branch push');
          if(!/^[a-f0-9]{40}$/.test(e.CANDIDATE_SHA??'')||e.CANDIDATE_SHA!==e.SOURCE_SHA) throw Error('Candidate must equal the exact pushed SHA');
          if(!['npm','yarn'].includes(e.PACKAGE_MANAGER)||!/^setup:[a-z0-9:-]+$/.test(e.SETUP_SCRIPT??'')) throw Error('Unsupported app setup contract');
          const paths=JSON.parse(e.ENVIRONMENT_PATHS);
          if(!Array.isArray(paths)||!paths.length||paths.length>20||new Set(paths).size!==paths.length||paths.some(p=>typeof p!=='string'||!/^\.?[A-Za-z0-9_-][A-Za-z0-9_./-]*$/.test(p)||p.split('/').some(x=>['','..','.','.git'].includes(x)))) throw Error('Environment paths must stay within the repository');
          const include=['lint','tsc','build'].map(check=>({check,shard:1,shards:1}));
          for(const [check,key] of [['unit','UNIT_SHARDS'],['integration','INTEGRATION_SHARDS'],['e2e','E2E_SHARDS']]) {
            if(!/^(?:[1-9]|1[0-6])$/.test(e[key]??'')) throw Error('Each test suite needs 1 to 16 shards');
            for(let shard=1;shard<=Number(e[key]);shard++) include.push({check,shard,shards:Number(e[key])});
          }
          appendFileSync(e.GITHUB_OUTPUT,'matrix='+JSON.stringify({include})+'\n');
          JS

  source-admission:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    outputs:
      candidate_digest: ${{ steps.admission.outputs.candidate_digest }}
      policy_digest: ${{ steps.admission.outputs.policy_digest }}
      tree_sha: ${{ steps.admission.outputs.tree_sha }}
    steps:
      - id: admission
        name: Verify the signed candidate with the existing source authority
        env:
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_OWNER_ID: ${{ github.repository_owner_id }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          node --input-type=module <<'JS'
          // contract: source-admission
          // Ref names are validated before they reach Git or provider URLs.
          function validHeadRef(value) {
           if(typeof value!=='string'||!value.startsWith('refs/heads/')||value.length>240)return false;
           const name=value.slice(11);
           return /^[A-Za-z0-9_./-]+$/.test(name)&&!!name&&!/[\x00-\x20\x7f~^:?*\[\\]/.test(name)&&!name.includes('..')&&!name.includes('@{')&&!name.endsWith('.')&&name.split('/').every(part=>part&&!part.startsWith('.')&&!part.endsWith('.lock'));
          }
          function integrationRef(sourceRef) {
           if(!validHeadRef(sourceRef)||sourceRef==='refs/heads/main'||sourceRef.startsWith('refs/heads/int/'))throw Error('Invalid integration source ref');
           return 'refs/heads/int/'+sourceRef.slice(11);
          }
          function isIntegrationRef(value) {
           if(typeof value!=='string'||!value.startsWith('refs/heads/int/'))return false;
           try{return integrationRef('refs/heads/'+value.slice(15))===value;}catch{return false;}
          }

          // Commission only through reviewed workflow_depot source, never an app input,
          // repository variable, environment override, or token-selected destination.
          const CANDIDATE_ADMISSION_ORIGIN = '';

          // Shared transport validation: this is accepted policy metadata, never a token,
          // provider configuration, executable input, or a runtime self-referential pin.
          function validateCandidateReviewPolicy(value,source,candidate,expected={}){
           if(value===null)return null;
           const require=value=>{if(!value)throw Error('Invalid candidate review policy');};
           const exact=(value,keys)=>require(value&&typeof value==='object'&&!Array.isArray(value)&&Object.keys(value).sort().join(',')===[...keys].sort().join(','));
           const positive=v=>Number.isSafeInteger(v)&&v>0,hex=v=>typeof v==='string'&&/^[a-f0-9]{64}$/.test(v),sha=v=>typeof v==='string'&&/^[a-f0-9]{40}$/.test(v);
           const text=(v,max=1000)=>typeof v==='string'&&v.length>0&&v.length<=max;
           const strings=(xs,max=100,maxLength=300)=>Array.isArray(xs)&&xs.length<=max&&xs.every(v=>text(v,maxLength))&&new Set(xs).size===xs.length;
           const ids=xs=>Array.isArray(xs)&&xs.length<=100&&xs.every(positive)&&new Set(xs).size===xs.length;
           require(new TextEncoder().encode(JSON.stringify(value)).length<=256*1024);
           exact(value,['repositoryID','commitSHA','policyDigest','policy']);
           require(value.repositoryID===source.repositoryID&&value.commitSHA===source.commitSHA&&hex(value.policyDigest)&&value.policyDigest===candidate.policyDigest);
           const p=value.policy;
           exact(p,['repository','repositoryID','ownerID','policyDigest','reviewPolicy','scanPolicy','priorJobs','applicablePolicy','maxAgeSeconds']);
           require(p.repository===source.repository&&p.repositoryID===source.repositoryID&&positive(p.ownerID)&&p.policyDigest===value.policyDigest&&positive(p.maxAgeSeconds)&&p.maxAgeSeconds<=86400&&(!expected.ownerID||p.ownerID===expected.ownerID));
           const j=p.priorJobs;
           exact(j,['workflowID','workflowPath','workflowDigest','jobWorkflowRef','jobWorkflowSHA','actorIDs','requiredJobNames','scanJobName','maxAgeSeconds','policyDigest']);
           require(positive(j.workflowID)&&j.workflowPath==='.github/workflows/build.yml'&&hex(j.workflowDigest)&&sha(j.jobWorkflowSHA)&&j.jobWorkflowRef===source.repository.split('/')[0]+'/workflow_depot/.github/workflows/orchestration.yml@'+j.jobWorkflowSHA&&ids(j.actorIDs)&&j.actorIDs.length>0&&strings(j.requiredJobNames)&&j.requiredJobNames.length>0&&j.requiredJobNames.includes(j.scanJobName)&&positive(j.maxAgeSeconds)&&j.maxAgeSeconds<=86400&&j.policyDigest===value.policyDigest);
           require((!expected.jobWorkflowRef||j.jobWorkflowRef===expected.jobWorkflowRef)&&(!expected.jobWorkflowSHA||j.jobWorkflowSHA===expected.jobWorkflowSHA));
           const r=p.reviewPolicy;
           exact(r,['styleGuideDigest','styleGuideRevision','styleGuidePath','reviewerAppID','reviewerInstallationID','reviewerActorID','privilegedAppIDs','privilegedActorIDs','allowBotApproval','requiresHumanReview',...(Object.hasOwn(r??{},'checkName')?['checkName']:[])]);
           require(hex(r.styleGuideDigest)&&sha(r.styleGuideRevision)&&text(r.styleGuidePath,500)&&[r.reviewerAppID,r.reviewerInstallationID,r.reviewerActorID].every(positive)&&ids(r.privilegedAppIDs)&&ids(r.privilegedActorIDs)&&typeof r.allowBotApproval==='boolean'&&typeof r.requiresHumanReview==='boolean'&&(!Object.hasOwn(r,'checkName')||text(r.checkName,300)));
           const a=p.applicablePolicy;
           exact(a,['languages','frameworks','dependencyPolicyDigest','documents','rules']);require(strings(a.languages)&&strings(a.frameworks)&&hex(a.dependencyPolicyDigest)&&strings(a.rules)&&Array.isArray(a.documents)&&a.documents.length<=100);
           for(const d of a.documents){exact(d,['kind','name','revision','digest','text']);require(['language','framework','dependencies'].includes(d.kind)&&text(d.name,300)&&sha(d.revision)&&hex(d.digest)&&text(d.text,16384));}
           const scan=p.scanPolicy;
           exact(scan,['supportedLanguages','supportedFrameworks','requiredCategories','requiredTools','exemptions','sonarqubeStandardRulesetDigest']);
           require(strings(scan.supportedLanguages)&&strings(scan.supportedFrameworks)&&strings(scan.requiredCategories)&&Array.isArray(scan.requiredTools)&&scan.requiredTools.length<=100&&Array.isArray(scan.exemptions)&&scan.exemptions.length<=1000&&hex(scan.sonarqubeStandardRulesetDigest));
           for(const t of scan.requiredTools){exact(t,['id','category','version','rulesetDigest','databaseMaxAgeSeconds']);require(text(t.id)&&text(t.category)&&text(t.version)&&hex(t.rulesetDigest)&&Number.isSafeInteger(t.databaseMaxAgeSeconds)&&t.databaseMaxAgeSeconds>=0);}
           for(const e of scan.exemptions){exact(e,['toolID','path','reason']);require(text(e.toolID)&&text(e.path)&&text(e.reason));}
           return value;
          }

          async function verifySourceCandidate(source,{fetcher=fetch,env=process.env}={}){
           if(!CANDIDATE_ADMISSION_ORIGIN)throw Error('Candidate admission origin is not commissioned');
           try{
            const require=value=>{if(!value)throw Error();};
            const exact=(value,keys)=>require(value&&typeof value==='object'&&!Array.isArray(value)&&Object.keys(value).sort().join(',')===[...keys].sort().join(','));
            const positive=value=>Number.isSafeInteger(value)&&value>0;
            const canonical=value=>JSON.stringify(value===null||typeof value!=='object'?value:Array.isArray(value)?value.map(v=>JSON.parse(canonical(v))):Object.fromEntries(Object.keys(value).sort().map(k=>[k,JSON.parse(canonical(value[k]))])));
            const hash=async value=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical(value)))),v=>v.toString(16).padStart(2,'0')).join('');
            exact(source,['repository','repositoryID','commitSHA','sourceRef','runID','runAttempt']);
            require(typeof source.repository==='string'&&source.repository.length<=201&&/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(source.repository)&&[source.repositoryID,source.runID,source.runAttempt].every(positive)&&typeof source.commitSHA==='string'&&/^[a-f0-9]{40}$/.test(source.commitSHA));
            require(isIntegrationRef(source.sourceRef));
            source=JSON.parse(canonical(source));
            const origin=new URL(CANDIDATE_ADMISSION_ORIGIN);
            require(origin.protocol==='https:'&&origin.origin===CANDIDATE_ADMISSION_ORIGIN&&!origin.username&&!origin.password&&!origin.port&&/(?:^|\.)(?:vespoli\.me|anthonyvespoli\.com)$/.test(origin.hostname));
            const tokenURL=new URL(env.ACTIONS_ID_TOKEN_REQUEST_URL);
            require(tokenURL.protocol==='https:'&&!tokenURL.username&&!tokenURL.password&&!tokenURL.port&&!tokenURL.hash&&tokenURL.hostname.endsWith('.actions.githubusercontent.com')&&typeof env.ACTIONS_ID_TOKEN_REQUEST_TOKEN==='string'&&env.ACTIONS_ID_TOKEN_REQUEST_TOKEN.length>0&&env.ACTIONS_ID_TOKEN_REQUEST_TOKEN.length<=16384);
            tokenURL.searchParams.set('audience','workflow-depot-candidate:'+await hash(source));
            async function read(response,max){
             require(response.ok);const reader=response.body?.getReader();require(reader);const chunks=[];let length=0;
             try{for(;;){const {done,value}=await reader.read();if(done)break;length+=value.byteLength;if(length>max){await reader.cancel();throw Error();}chunks.push(value);}}finally{reader.releaseLock();}
             const bytes=new Uint8Array(length);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.byteLength;}
             return JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));
            }
            const token=await read(await fetcher(tokenURL.href,{redirect:'error',signal:AbortSignal.timeout(10000),headers:{Authorization:'Bearer '+env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}}),32768);
            require(typeof token.value==='string'&&token.value.length>0&&token.value.length<=16384);
            const result=await read(await fetcher(origin.origin+'/v1/candidates/verify',{method:'POST',redirect:'error',signal:AbortSignal.timeout(30000),headers:{'content-type':'application/json'},body:JSON.stringify({source,oidcToken:token.value})}),512*1024);
            exact(result,['verified','source','candidateDigest','candidate','reviewPolicy']);
            require(result.verified===true&&canonical(result.source)===canonical(source)&&typeof result.candidateDigest==='string'&&/^[a-f0-9]{64}$/.test(result.candidateDigest));
            const c=result.candidate;
            exact(c,['schema','verified','repository','repositoryID','commitSHA','treeSHA','sourceRef','sourceSHA','expectedMainParent','shadowRef','sourcePR','sequence','signerKeyID','unsignedCommitDigest','artifactIntentDigest','policyDigest','sourceHistoryDigest']);
            require(c.schema==='repoctl-source-candidate/v1'&&c.verified===true&&c.repository===source.repository&&c.repositoryID===source.repositoryID&&c.commitSHA===source.commitSHA&&c.shadowRef===source.sourceRef&&positive(c.sequence)&&integrationRef(c.sourceRef)===source.sourceRef&&await hash(c)===result.candidateDigest);
            validateCandidateReviewPolicy(result.reviewPolicy,source,c);
            return result;
           }catch{throw Error('Candidate admission failed');}
          }
          const e=process.env;
          if(e.SOURCE_EVENT!=='push'||e.SOURCE_OWNER_ID!=='215839550'||!/^susanbeasles\/[A-Za-z0-9_.-]+$/.test(e.SOURCE_REPOSITORY??'')||e.CANDIDATE_SHA!==e.SOURCE_SHA) throw Error('Untrusted candidate context');
          for(const key of ['SOURCE_REPOSITORY_ID','SOURCE_RUN_ID','SOURCE_RUN_ATTEMPT']) if(!/^[1-9][0-9]*$/.test(e[key]??'')||!Number.isSafeInteger(Number(e[key]))) throw Error('Invalid candidate coordinates');
          const source={repository:e.SOURCE_REPOSITORY,repositoryID:Number(e.SOURCE_REPOSITORY_ID),commitSHA:e.SOURCE_SHA,sourceRef:e.SOURCE_REF,runID:Number(e.SOURCE_RUN_ID),runAttempt:Number(e.SOURCE_RUN_ATTEMPT)};
          const result=await verifySourceCandidate(source);
          if(!/^[a-f0-9]{64}$/.test(result.candidate.policyDigest)||!/^[a-f0-9]{40}$/.test(result.candidate.treeSHA)) throw Error('Invalid verified candidate coordinates');
          const {appendFileSync}=await import('node:fs');
          appendFileSync(e.GITHUB_OUTPUT,'candidate_digest='+result.candidateDigest+'\npolicy_digest='+result.candidate.policyDigest+'\ntree_sha='+result.candidate.treeSHA+'\n');
          console.log('Signed candidate proof verified');
          JS

  setup:
    needs: [validate, source-admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      environment_digest: ${{ steps.archive.outputs.digest }}
      node_version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          package-manager-cache: false
      - name: App-owned validated cache or clean environment setup
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          SETUP_SCRIPT: ${{ inputs.setup_script }}
        run: |
          node --input-type=module <<'JS'
          // contract: setup
          const {readFileSync}=await import('node:fs');
          const {execFileSync}=await import('node:child_process');
          const e=process.env;
          if(!['npm','yarn'].includes(e.PACKAGE_MANAGER)||!/^setup:[a-z0-9:-]+$/.test(e.SETUP_SCRIPT??'')) throw Error('Unsupported app setup contract');
          const manifest=JSON.parse(readFileSync('package.json','utf8'));
          if(typeof manifest.scripts?.[e.SETUP_SCRIPT]!=='string') throw Error('Required setup script missing');
          execFileSync(e.PACKAGE_MANAGER,['run',e.SETUP_SCRIPT],{stdio:'inherit',shell:false,timeout:900000});
          JS
      - id: archive
        name: Record the immutable environment digest
        env:
          ENVIRONMENT_PATHS: ${{ inputs.environment_paths }}
        run: |
          node --input-type=module <<'JS'
          // contract: archive
          const {readFileSync,appendFileSync,lstatSync,realpathSync}=await import('node:fs');
          const {createHash}=await import('node:crypto');
          const {execFileSync}=await import('node:child_process');
          const {resolve,sep}=await import('node:path');
          const root=realpathSync(process.env.GITHUB_WORKSPACE);
          const paths=JSON.parse(process.env.ENVIRONMENT_PATHS);
          for(const path of paths) {
            if(typeof path!=='string'||!/^\.?[A-Za-z0-9_-][A-Za-z0-9_./-]*$/.test(path)||path.split('/').some(x=>['','..','.','.git'].includes(x))) throw Error('Unsafe environment path');
            const location=resolve(root,path);
            if(!lstatSync(location).isDirectory()||!realpathSync(location).startsWith(root+sep)) throw Error('Environment must contain repo-owned directories');
          }
          const archive=resolve(process.env.RUNNER_TEMP,'environment.tar.gz');
          execFileSync('tar',['-czf',archive,'--',...paths],{cwd:root,stdio:'inherit',shell:false,timeout:120000});
          appendFileSync(process.env.GITHUB_OUTPUT,'digest='+createHash('sha256').update(readFileSync(archive)).digest('hex')+'\n');
          JS
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ci-env-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/environment.tar.gz
          retention-days: 1
          if-no-files-found: error
          overwrite: false

  checks:
    needs: [validate, source-admission, setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    name: ${{ matrix.check }} ${{ matrix.shard }}/${{ matrix.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ needs.setup.outputs.node_version }}
          package-manager-cache: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: ci-env-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/ci-environment
      - name: Verify environment bytes before restoring
        env:
          ENVIRONMENT_DIGEST: ${{ needs.setup.outputs.environment_digest }}
        run: |
          node --input-type=module <<'JS'
          // contract: restore
          const {readFileSync}=await import('node:fs');
          const {createHash}=await import('node:crypto');
          const {execFileSync}=await import('node:child_process');
          const archive=process.env.RUNNER_TEMP+'/ci-environment/environment.tar.gz';
          const expected=process.env.ENVIRONMENT_DIGEST;
          if(!/^[a-f0-9]{64}$/.test(expected??'')||createHash('sha256').update(readFileSync(archive)).digest('hex')!==expected) throw Error('Environment artifact digest mismatch');
          execFileSync('tar',['-xzf',archive,'--no-same-owner','--no-same-permissions'],{stdio:'inherit',shell:false,timeout:120000});
          JS
      - name: Execute the required app contract
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          CHECK: ${{ matrix.check }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          node --input-type=module <<'JS'
          // contract: payload
          const {readFileSync}=await import('node:fs');
          const {execFileSync}=await import('node:child_process');
          const e=process.env,test=['unit','integration','e2e'].includes(e.CHECK);
          if(!['npm','yarn'].includes(e.PACKAGE_MANAGER)||(!test&&!['lint','tsc','build'].includes(e.CHECK))||! /^(?:[1-9]|1[0-6])$/.test(e.SHARD??'')||! /^(?:[1-9]|1[0-6])$/.test(e.SHARDS??'')||Number(e.SHARD)>Number(e.SHARDS)) throw Error('Invalid app check');
          const name=test?'test:ci':e.CHECK;
          const manifest=JSON.parse(readFileSync('package.json','utf8'));
          if(typeof manifest.scripts?.[name]!=='string') throw Error('Required app script missing');
          const args=['run',name];
          if(test) args.push(...(e.PACKAGE_MANAGER==='npm'?['--']:[]),'--suite',e.CHECK,'--shard-index',e.SHARD,'--shard-count',e.SHARDS);
          execFileSync(e.PACKAGE_MANAGER,args,{stdio:'inherit',shell:false,timeout:1500000});
          JS

  full-scans:
    needs: [validate, source-admission, setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Source-owned commissioning value, never selected by an application.
      REVIEWED_DEPOT_SHA: REVIEWED_DEPOT_SHA
    outputs:
      scan_report_digest: ${{ steps.scan.outputs.scan_report_digest }}
      scan_artifact_id: ${{ steps.report.outputs.artifact-id }}
    steps:
      - name: Require reviewed scanner implementation revision
        run: |
          node --input-type=module <<'JS'
          if(!/^[a-f0-9]{40}$/.test(process.env.REVIEWED_DEPOT_SHA??'')) throw Error('Trusted scanner depot revision is not commissioned');
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: susanbeasles/workflow_depot
          ref: ${{ env.REVIEWED_DEPOT_SHA }}
          path: trusted-scanners
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: app-source
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ needs.setup.outputs.node_version }}
          package-manager-cache: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: ci-env-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/ci-environment
      - name: Verify and restore only this app environment
        env:
          ENVIRONMENT_DIGEST: ${{ needs.setup.outputs.environment_digest }}
        run: |
          /usr/bin/python3 trusted-scanners/scripts/restore-environment.py "$RUNNER_TEMP/ci-environment/environment.tar.gz" "$GITHUB_WORKSPACE/app-source" "$ENVIRONMENT_DIGEST"
      - name: Install only source-pinned scanner distributions
        run: python3 trusted-scanners/scripts/install-scanners.py /tmp/workflow-depot-scanners
      - id: scan
        name: Execute trusted local adapters and require full evidence
        env:
          APP_SOURCE_DIRECTORY: ${{ github.workspace }}/app-source
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_REF: ${{ github.ref }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TREE_SHA: ${{ needs.source-admission.outputs.tree_sha }}
          CANDIDATE_POLICY_DIGEST: ${{ needs.source-admission.outputs.policy_digest }}
          ENVIRONMENT_DIGEST: ${{ needs.setup.outputs.environment_digest }}
        run: node trusted-scanners/scripts/full-scans.mjs
      - id: report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: scan-report-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/scan-report.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  reviewer:
    needs: [validate, source-admission, setup, checks, full-scans]
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    uses: ./.github/workflows/review-candidate.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      scan_report_digest: ${{ needs.full-scans.outputs.scan_report_digest }}
      scan_artifact_id: ${{ needs.full-scans.outputs.scan_artifact_id }}

  required:
    if: ${{ always() }}
    needs: [validate, source-admission, setup, checks, full-scans, reviewer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every stage to pass
        env:
          STAGES: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          // contract: required
          const stages=JSON.parse(process.env.STAGES);
          for(const name of ['validate','source-admission','setup','checks','full-scans','reviewer']) if(stages[name]?.result!=='success') throw Error('Required candidate stage did not pass: '+name);
          JS

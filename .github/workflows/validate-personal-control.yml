name: Validate personal-control integration
on:
  workflow_call:
permissions:
  contents: read
  id-token: write
jobs:
  admission:
    permissions:
      contents: read
      id-token: write
    uses: susanbeasles/workflow_depot/.github/workflows/admit-integration.yml@8659f3b78f23870e78ac8f7c98f72b5d786c229a
    with:
      candidate_sha: ${{ github.sha }}
  verify:
    needs: [admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild esbuild workerd --ignore-scripts=false --foreground-scripts
      - run: npm test
      - run: npm run build

name: Request exact Cloudflare deployment authorization
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact canonical approved-operation JSON, including the waiting executor run
        required: true
        type: string
      operation_digest:
        description: SHA-256 of the exact canonical operation JSON bytes
        required: true
        type: string
permissions: {}
jobs:
  authorize:
    if: github.repository == 'susanbeasles/workflow_depot' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cloudflare-authorizer.yml
    with:
      operation: ${{ inputs.operation }}
      operation_digest: ${{ inputs.operation_digest }}

# Caller template. Install in each repository as .github/workflows/ci.yml (any file name except pipeline.yml,
# which workflow_depot itself uses for the reusable workflow). The job id must stay `pipeline` and must have
# no `name:`: the authorizer requires the check names `pipeline / lint-test`, `pipeline / quality`,
# `pipeline / security` and `pipeline / build`. Replace the SHA with a reviewed workflow_depot commit.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['shadow/pr-*']

permissions: {}

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: susanbeasles/workflow_depot/.github/workflows/pipeline.yml@0000000000000000000000000000000000000000 # REPLACE: reviewed workflow_depot SHA
    # The most any pipeline job needs; each job inside grants itself less.
    permissions:
      contents: read # checkout
      id-token: write # build (attestation), shadow and promote (authorizer)
      attestations: write # build (attestation)
    # Every input is optional; the defaults suit a Node repository with package-lock.json. For example:
    # with:
    #   working-directory: app
    #   test: npm test -- --test-reporter=spec
    #   artifact-path: dist
    #   require-attestation: false   # only where GitHub attestations are unavailable

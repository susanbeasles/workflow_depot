# The orchestrator: every repository's single CI/CD entry point (infra-root CONTROL-PLANE-SPEC 5.6, ADR-0001
# section 1, ADR-0002 section 1). Staged at pipeline/pipeline.yml in susanbeasles/workflow_depot; the owner
# installs it byte for byte at .github/workflows/pipeline.yml (pipeline/README.md). Stage map: docs/pipeline.md.
#
#   config (pipeline.json, depot_ref == pinned SHA)
#     -> lint-test (1)   quality (2)   security-assurance (3, reusable) -> security (3 gate)
#     -> compile (4, unprivileged: install, build, package, SBOM) -> build (4, attest; terraform: terraform.plan, not wired)
#     -> shadow (5, pull_request)  |  promote (5, push shadow/pr-*)
#     -> release (6, push main or vX.Y.Z tag, reusable release.yml)
#     -> deploy (7, after a release: OIDC request to the authorizer, not wired)  |  infra-apply (7, terraform, not wired)
#
# Callers use a caller whose calling job id is `pipeline`, so the check names are `pipeline / <job>`. The
# authorizer requires `pipeline / lint-test`, `quality`, `security` and `build` exactly: do not rename those
# jobs or add another `name:`. Nested workflows are referenced as ./.github/workflows/<file>, which GitHub
# resolves to this repository at the same commit as this file, so they are pinned by the caller's SHA.
#
# Repository input is pipeline.json (docs/contracts.md section 12), validated by ci/pipeline-config.mjs in the
# config job; later jobs read only its validated outputs, and those reach the shell through `env:` only: no
# `${{ }}` appears inside any `run:` block (pipeline/test enforces it).
# Steps marked `# embedded:` are pipeline/scripts/*.cjs copied in by `node pipeline/embed.mjs`.
name: pipeline

on:
  workflow_call:
    inputs:
      depot_ref:
        description: Full 40-hex workflow_depot commit; must equal the SHA this workflow is pinned to in `uses:`.
        type: string
        required: true
      require-attestation:
        description: Attest build provenance for the artifact. Set false only where attestations are unavailable.
        type: boolean
        default: true
    outputs:
      artifact_digest:
        description: sha256:<hex> of the packaged artifact.
        value: ${{ jobs.build.outputs.artifact_digest }}
      candidate_sha:
        description: pull_request runs, the shadow candidate the pipeline runs on next.
        value: ${{ jobs.shadow.outputs.candidate_sha }}
      promotion_outcome:
        description: shadow/pr-* runs, `promoted` or `stale_base`.
        value: ${{ jobs.promote.outputs.outcome }}
      main_sha:
        description: shadow/pr-* runs, main after promotion.
        value: ${{ jobs.promote.outputs.main_sha }}
      tag:
        description: shadow/pr-* runs, the provenance tag.
        value: ${{ jobs.promote.outputs.tag }}
      released:
        description: main and tag runs, 'true' when stage 6 published a release.
        value: ${{ jobs.release.outputs.released }}
      release_tag:
        description: main and tag runs, the published vX.Y.Z (empty when nothing was released).
        value: ${{ jobs.release.outputs.releaseTag }}

permissions: {}

jobs:
  config:
    name: config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # sparse checkout of the caller's pipeline.json
      id-token: write # routing claim only (audience workflow-depot-route): binds depot_ref to this file's commit
    outputs:
      ecosystem: ${{ steps.read.outputs.ecosystem }}
      policy_profile: ${{ steps.read.outputs.policy_profile }}
      working_directory: ${{ steps.read.outputs.working_directory }}
      node_version: ${{ steps.read.outputs.node_version }}
      script_lint: ${{ steps.read.outputs.script_lint }}
      script_typecheck: ${{ steps.read.outputs.script_typecheck }}
      script_test: ${{ steps.read.outputs.script_test }}
      script_build: ${{ steps.read.outputs.script_build }}
      rebuild: ${{ steps.read.outputs.rebuild }}
      coverage_summary: ${{ steps.read.outputs.coverage_summary }}
      coverage_min: ${{ steps.read.outputs.coverage_min }}
      output_directory: ${{ steps.read.outputs.output_directory }}
      release: ${{ steps.read.outputs.release }}
      application_manifest: ${{ steps.read.outputs.application_manifest }}
      deploy_targets: ${{ steps.read.outputs.deploy_targets }}
      terraform_plan: ${{ steps.read.outputs.terraform_plan }}
      terraform_apply: ${{ steps.read.outputs.terraform_apply }}
    steps:
      - name: Find the workflow_depot commit this pipeline runs at
        id: route
        shell: node {0}
        # embedded: pipeline/scripts/workflow-sha.cjs
        run: |
          'use strict';
          // pipeline/scripts/workflow-sha.cjs: find the workflow_depot commit this reusable workflow runs at.
          // Embedded byte for byte in pipeline.yml (shell: node {0}); pipeline/test checks that the two match.
          // It reads this job's OIDC token, decodes the job_workflow_sha claim and writes `sha=<40 hex>` to
          // GITHUB_OUTPUT. The signature is not checked: this only picks which commit to check out, and the
          // authorizer verifies its own token. The token's audience is accepted by no service, so a leaked
          // token is worthless. The token is never printed.
          const { appendFileSync } = require('node:fs');

          const AUDIENCE = 'workflow-depot-route';
          const WORKFLOW = 'susanbeasles/workflow_depot/.github/workflows/pipeline.yml@';
          const SHA = /^[0-9a-f]{40}$/;

          class RouteError extends Error {}

          function decodeClaims(jwt) {
            const parts = typeof jwt === 'string' ? jwt.split('.') : [];
            if (parts.length !== 3 || !/^[A-Za-z0-9_-]+$/.test(parts[1])) throw new RouteError('OIDC token is not a JWT');
            let claims;
            try {
              claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            } catch {
              throw new RouteError('OIDC token payload is not JSON');
            }
            if (claims === null || typeof claims !== 'object' || Array.isArray(claims)) throw new RouteError('OIDC token payload is not an object');
            return claims;
          }

          function workflowSha(claims) {
            const ref = claims.job_workflow_ref;
            if (typeof ref !== 'string' || !ref.startsWith(WORKFLOW) || ref.length === WORKFLOW.length) {
              throw new RouteError('job_workflow_ref is not susanbeasles/workflow_depot pipeline.yml: run this job only inside the reusable pipeline');
            }
            const sha = claims.job_workflow_sha;
            if (typeof sha !== 'string' || !SHA.test(sha)) throw new RouteError('job_workflow_sha is missing or not 40 lowercase hex');
            return sha;
          }

          async function oidcToken(env, fetchImpl) {
            const url = env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const bearer = env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!url || !bearer) throw new RouteError('no OIDC token available: the job needs `permissions: id-token: write`');
            const target = new URL(url);
            target.searchParams.set('audience', AUDIENCE);
            const res = await fetchImpl(target, { headers: { authorization: `bearer ${bearer}` }, redirect: 'error', signal: AbortSignal.timeout(15000) });
            if (res.status !== 200) throw new RouteError(`OIDC token request failed with ${res.status}`);
            const text = await res.text();
            if (text.length > 16384) throw new RouteError('OIDC token response too large');
            let value;
            try {
              value = JSON.parse(text).value;
            } catch {
              throw new RouteError('OIDC token response is not JSON');
            }
            if (typeof value !== 'string') throw new RouteError('OIDC token response has no token');
            return value;
          }

          async function main(env = process.env, fetchImpl = fetch, log = console.log) {
            const sha = workflowSha(decodeClaims(await oidcToken(env, fetchImpl)));
            if (env.GITHUB_OUTPUT) appendFileSync(env.GITHUB_OUTPUT, `sha=${sha}\n`);
            log(`workflow_depot pipeline.yml runs at ${sha}`);
            return sha;
          }

          module.exports = { AUDIENCE, WORKFLOW, RouteError, decodeClaims, workflowSha, oidcToken, main };

          if (require.main === module) {
            main().catch((error) => {
              console.log(`::error title=workflow-sha::${error instanceof RouteError ? error.message : 'unexpected failure'}`);
              process.exitCode = 1;
            });
          }
      - name: depot_ref must equal the pinned SHA
        env:
          DEPOT_REF: ${{ inputs.depot_ref }}
          PINNED_SHA: ${{ steps.route.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPOT_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=depot_ref::depot_ref must be a full 40-hex commit SHA"; exit 1; }
          [ "$DEPOT_REF" = "$PINNED_SHA" ] || { echo "::error title=depot_ref::depot_ref $DEPOT_REF is not the SHA this pipeline is pinned to ($PINNED_SHA); pass the SHA from uses:"; exit 1; }
          echo "depot_ref equals the pinned workflow_depot commit $PINNED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: susanbeasles/workflow_depot
          ref: ${{ inputs.depot_ref }}
          path: .workflow-depot
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
          sparse-checkout: /pipeline.json
          sparse-checkout-cone-mode: false
      - name: Validate pipeline.json
        id: read
        run: |
          set -euo pipefail
          test "$(git -C .workflow-depot rev-parse HEAD)" = "$DEPOT_REF"
          node .workflow-depot/ci/pipeline-config.mjs --app-root src --config pipeline.json --github-output "$GITHUB_OUTPUT"
        env:
          DEPOT_REF: ${{ inputs.depot_ref }}

  lint-test:
    name: lint-test # stage 1; the check name is `pipeline / lint-test`; the authorizer requires it exactly
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ needs.config.outputs.working_directory }}
    steps:
      # Telemetry hook: actions/runner-telemetry (built separately) goes first in each job once reviewed and pinned.
      - name: Stage 1 for terraform is not wired
        if: needs.config.outputs.ecosystem == 'terraform'
        working-directory: .
        run: |
          echo "::error title=lint-test::terraform stage 1 needs a pinned, checksum-verified OpenTofu; workflow_depot has none (security-assurance/policy/tool-registry.yml). See docs/pipeline.md, open questions."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Working directory stays inside the checkout
        working-directory: .
        env:
          WORKING_DIRECTORY: ${{ needs.config.outputs.working_directory }}
        shell: node {0}
        # embedded: pipeline/scripts/workdir-check.cjs
        run: |
          'use strict';
          // pipeline/scripts/workdir-check.cjs: the configured working directory must stay inside the checkout. Embedded byte
          // for byte in pipeline.yml (shell: node {0}); pipeline/test checks that the two match. Runs from the checkout root
          // right after checkout, before any step uses the directory. ci/pipeline-config.mjs only checks the path's spelling;
          // a tracked symlink in any component could still point outside the repository, so every component is lstat'ed
          // (no symlinks, directories only) and the resolved path must stay under the resolved checkout root.
          const { lstatSync, realpathSync } = require('node:fs');
          const path = require('node:path');

          const RELATIVE = /^[A-Za-z0-9._-]+(?:\/[A-Za-z0-9._-]+)*$/;

          class WorkdirError extends Error {}

          function check(root, dir) {
            if (dir === '.') return realpathSync(root);
            if (typeof dir !== 'string' || !RELATIVE.test(dir) || dir.split('/').some((s) => s === '.' || s === '..')) {
              throw new WorkdirError('WORKING_DIRECTORY must be . or a normalized relative path');
            }
            let current = root;
            for (const segment of dir.split('/')) {
              current = path.join(current, segment);
              let stat;
              try {
                stat = lstatSync(current);
              } catch {
                throw new WorkdirError(`${dir}: ${path.relative(root, current)} does not exist in the checkout`);
              }
              if (stat.isSymbolicLink()) throw new WorkdirError(`${dir}: ${path.relative(root, current)} is a symlink; the working directory must be a real directory inside the checkout`);
              if (!stat.isDirectory()) throw new WorkdirError(`${dir}: ${path.relative(root, current)} is not a directory`);
            }
            const realRoot = realpathSync(root);
            const resolved = realpathSync(current);
            if (resolved !== realRoot && !resolved.startsWith(`${realRoot}${path.sep}`)) throw new WorkdirError(`${dir} resolves outside the checkout`);
            return resolved;
          }

          module.exports = { WorkdirError, check };

          if (require.main === module) {
            try {
              check(process.cwd(), process.env.WORKING_DIRECTORY);
              console.log(`working directory ${process.env.WORKING_DIRECTORY} is inside the checkout`);
            } catch (error) {
              console.log(`::error title=working-directory::${error instanceof WorkdirError ? error.message : 'unexpected failure'}`);
              process.exitCode = 1;
            }
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          package-manager-cache: false
          # Cache npm's tarball store only when there is a lockfile; `npm ci` re-verifies every integrity hash.
          cache: ${{ hashFiles(format('{0}/package-lock.json', needs.config.outputs.working_directory)) != '' && 'npm' || '' }}
          cache-dependency-path: ${{ needs.config.outputs.working_directory }}/package-lock.json
      - name: Install
        env:
          REBUILD: ${{ needs.config.outputs.rebuild }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          # Install scripts run only for the packages pipeline.json names in `rebuild`.
          read -r -a packages <<< "$REBUILD"
          if [ "${#packages[@]}" -gt 0 ]; then npm rebuild "${packages[@]}" --ignore-scripts=false --foreground-scripts; fi
      - name: Lint
        env:
          SCRIPT: ${{ needs.config.outputs.script_lint }}
        run: npm run "$SCRIPT"
      - name: Typecheck
        env:
          SCRIPT: ${{ needs.config.outputs.script_typecheck }}
        run: npm run "$SCRIPT"
      - name: Test
        env:
          SCRIPT: ${{ needs.config.outputs.script_test }}
        run: npm run "$SCRIPT"
      - name: Coverage
        env:
          COVERAGE_SUMMARY: ${{ needs.config.outputs.coverage_summary }}
          COVERAGE_MIN: ${{ needs.config.outputs.coverage_min }}
        shell: node {0}
        # embedded: pipeline/scripts/coverage-check.cjs
        run: |
          'use strict';
          // pipeline/scripts/coverage-check.cjs: stage 1 coverage gate. Embedded byte for byte in pipeline.yml
          // (shell: node {0}); pipeline/test checks that the two match. Runs in the caller's working directory after the
          // test script. COVERAGE_SUMMARY is the Istanbul json-summary path from pipeline.json and COVERAGE_MIN the line
          // threshold of the policy profile, both validated by ci/pipeline-config.mjs in the config job and checked again
          // here. Fails unless total.lines covered/total reaches the threshold over a non-empty line count. The report path
          // may not pass through a symlink at any component, and its reported numbers must be self-consistent: a malformed
          // summary cannot pass the gate.
          const { appendFileSync, lstatSync, readFileSync, realpathSync } = require('node:fs');
          const path = require('node:path');

          const MAX_BYTES = 8 * 1024 * 1024;
          const RELATIVE = /^[A-Za-z0-9._-]+(?:\/[A-Za-z0-9._-]+)*$/;

          class CoverageError extends Error {}

          function check(cwd, summaryPath, min) {
            if (typeof summaryPath !== 'string' || !RELATIVE.test(summaryPath) || summaryPath.split('/').some((s) => s === '.' || s === '..')) {
              throw new CoverageError('COVERAGE_SUMMARY must be a normalized relative path');
            }
            const threshold = Number(min);
            if (!/^[1-9][0-9]?$|^100$/.test(String(min)) || !Number.isInteger(threshold)) throw new CoverageError('COVERAGE_MIN must be an integer from 1 to 100');
            const segments = summaryPath.split('/');
            let file = cwd;
            let stat;
            for (const [i, segment] of segments.entries()) {
              file = path.join(file, segment);
              try {
                stat = lstatSync(file);
              } catch {
                throw new CoverageError(`${summaryPath} does not exist: the test script must write an Istanbul json-summary report there`);
              }
              if (stat.isSymbolicLink()) throw new CoverageError(`${summaryPath}: ${segments.slice(0, i + 1).join('/')} is a symlink; the report must be a regular file inside the working directory`);
              if (i < segments.length - 1 && !stat.isDirectory()) throw new CoverageError(`${summaryPath}: ${segments.slice(0, i + 1).join('/')} is not a directory`);
            }
            if (!stat.isFile()) throw new CoverageError(`${summaryPath} must be a regular file, not a symlink or directory`);
            const realCwd = realpathSync(cwd);
            if (!realpathSync(file).startsWith(`${realCwd}${path.sep}`)) throw new CoverageError(`${summaryPath} resolves outside the working directory`);
            if (stat.size > MAX_BYTES) throw new CoverageError(`${summaryPath} is larger than ${MAX_BYTES} bytes`);
            let data;
            try {
              data = JSON.parse(readFileSync(file, 'utf8'));
            } catch {
              throw new CoverageError(`${summaryPath} is not JSON`);
            }
            const lines = data !== null && typeof data === 'object' ? data.total?.lines : undefined;
            if (lines === null || typeof lines !== 'object' || !Number.isInteger(lines.total) || lines.total <= 0 || typeof lines.pct !== 'number' || !Number.isFinite(lines.pct)) {
              throw new CoverageError(`${summaryPath} has no total.lines with a positive line count`);
            }
            if (!Number.isInteger(lines.covered) || lines.covered < 0 || lines.covered > lines.total) {
              throw new CoverageError(`${summaryPath}: total.lines.covered must be an integer from 0 to total.lines.total`);
            }
            if (lines.pct < 0 || lines.pct > 100) throw new CoverageError(`${summaryPath}: total.lines.pct must be from 0 to 100`);
            // The decision uses the counts, never the reported percentage; a pct that disagrees with them is malformed.
            const pct = (lines.covered * 100) / lines.total;
            if (Math.abs(pct - lines.pct) > 0.01 + Number.EPSILON * 100) throw new CoverageError(`${summaryPath}: total.lines.pct ${lines.pct} disagrees with covered/total ${lines.covered}/${lines.total}`);
            return { pct: Math.floor((lines.covered * 10000) / lines.total) / 100, covered: lines.covered, total: lines.total, threshold, ok: lines.covered * 100 >= threshold * lines.total };
          }

          function main(env = process.env, cwd = process.cwd(), log = console.log) {
            const result = check(cwd, env.COVERAGE_SUMMARY, env.COVERAGE_MIN);
            const line = `line coverage ${result.pct}% (${result.covered}/${result.total}); threshold ${result.threshold}%`;
            if (env.GITHUB_STEP_SUMMARY) appendFileSync(env.GITHUB_STEP_SUMMARY, `### Coverage\n\n${result.ok ? 'PASS' : 'FAIL'}: ${line}\n`);
            if (result.ok) log(`coverage: ${line}`);
            else log(`::error title=coverage::${line}`);
            return result;
          }

          module.exports = { CoverageError, check, main };

          if (require.main === module) {
            try {
              if (!main().ok) process.exitCode = 1;
            } catch (error) {
              console.log(`::error title=coverage::${error instanceof CoverageError ? error.message : 'unexpected failure'}`);
              process.exitCode = 1;
            }
          }

  quality:
    name: quality # stage 2; the check name is `pipeline / quality`; the authorizer requires it exactly
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Working directory stays inside the checkout
        working-directory: .
        env:
          WORKING_DIRECTORY: ${{ needs.config.outputs.working_directory }}
        shell: node {0}
        # embedded: pipeline/scripts/workdir-check.cjs
        run: |
          'use strict';
          // pipeline/scripts/workdir-check.cjs: the configured working directory must stay inside the checkout. Embedded byte
          // for byte in pipeline.yml (shell: node {0}); pipeline/test checks that the two match. Runs from the checkout root
          // right after checkout, before any step uses the directory. ci/pipeline-config.mjs only checks the path's spelling;
          // a tracked symlink in any component could still point outside the repository, so every component is lstat'ed
          // (no symlinks, directories only) and the resolved path must stay under the resolved checkout root.
          const { lstatSync, realpathSync } = require('node:fs');
          const path = require('node:path');

          const RELATIVE = /^[A-Za-z0-9._-]+(?:\/[A-Za-z0-9._-]+)*$/;

          class WorkdirError extends Error {}

          function check(root, dir) {
            if (dir === '.') return realpathSync(root);
            if (typeof dir !== 'string' || !RELATIVE.test(dir) || dir.split('/').some((s) => s === '.' || s === '..')) {
              throw new WorkdirError('WORKING_DIRECTORY must be . or a normalized relative path');
            }
            let current = root;
            for (const segment of dir.split('/')) {
              current = path.join(current, segment);
              let stat;
              try {
                stat = lstatSync(current);
              } catch {
                throw new WorkdirError(`${dir}: ${path.relative(root, current)} does not exist in the checkout`);
              }
              if (stat.isSymbolicLink()) throw new WorkdirError(`${dir}: ${path.relative(root, current)} is a symlink; the working directory must be a real directory inside the checkout`);
              if (!stat.isDirectory()) throw new WorkdirError(`${dir}: ${path.relative(root, current)} is not a directory`);
            }
            const realRoot = realpathSync(root);
            const resolved = realpathSync(current);
            if (resolved !== realRoot && !resolved.startsWith(`${realRoot}${path.sep}`)) throw new WorkdirError(`${dir} resolves outside the checkout`);
            return resolved;
          }

          module.exports = { WorkdirError, check };

          if (require.main === module) {
            try {
              check(process.cwd(), process.env.WORKING_DIRECTORY);
              console.log(`working directory ${process.env.WORKING_DIRECTORY} is inside the checkout`);
            } catch (error) {
              console.log(`::error title=working-directory::${error instanceof WorkdirError ? error.message : 'unexpected failure'}`);
              process.exitCode = 1;
            }
          }
      - name: Install actionlint and zizmor (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          # sha256 of the actionlint binary inside the release tarball (the tarball itself is checked against
          # the project's checksums file first).
          ACTIONLINT_BIN_SHA256: c872d6db8c6bf83a8eaa704fc93999f027d55dffbc63b8a6abdccb47df5f4cd4
          ZIZMOR_VERSION: 1.30.1
          # sha256 of zizmor-x86_64-unknown-linux-gnu.tar.gz, from security-assurance/policy/tool-registry.yml.
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/pipeline-bin"; work="$RUNNER_TEMP/pipeline-dl"; mkdir -p "$bin" "$work"; cd "$work"
          fetch() { curl -fsSL --proto '=https' --tlsv1.2 --retry 3 "$1" -o "$2"; }
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          fetch "$base/$tgz" "$tgz"
          fetch "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" actionlint.sums
          grep -E "^[0-9a-f]{64}  ${tgz}\$" actionlint.sums | sha256sum -c -
          mkdir actionlint && tar -xzf "$tgz" -C actionlint actionlint
          echo "${ACTIONLINT_BIN_SHA256}  actionlint/actionlint" | sha256sum -c -
          install -m 0755 actionlint/actionlint "$bin/actionlint"
          fetch "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" zizmor.tgz
          echo "${ZIZMOR_SHA256}  zizmor.tgz" | sha256sum -c -
          mkdir zizmor && tar -xzf zizmor.tgz -C zizmor
          install -m 0755 "$(find zizmor -type f -name zizmor | head -n 1)" "$bin/zizmor"
          "$bin/actionlint" -version | head -n 1
          "$bin/zizmor" --version
      - name: actionlint
        run: |
          # An explicit empty config: the repository's own actionlint config cannot relax the check.
          printf '{}\n' > "$RUNNER_TEMP/actionlint.yaml"
          "$RUNNER_TEMP/pipeline-bin/actionlint" -config-file "$RUNNER_TEMP/actionlint.yaml"
      - name: zizmor
        run: |
          # --no-config: a zizmor.yml in the repository cannot disable audits. Inline ignore comments still
          # apply; they are visible in review. Medium and high findings fail the job.
          "$RUNNER_TEMP/pipeline-bin/zizmor" --offline --no-config --no-progress --min-severity=medium --format=github .github/workflows
      - name: Lockfile
        working-directory: ${{ needs.config.outputs.working_directory }}
        shell: node {0}
        # embedded: pipeline/scripts/lockfile-check.cjs
        run: |
          'use strict';
          // pipeline/scripts/lockfile-check.cjs: the npm lockfile exists, matches package.json and pins every
          // downloaded package by integrity. Embedded byte for byte in pipeline.yml (shell: node {0});
          // pipeline/test checks that the two match. Runs in the caller's working directory. `npm ci` in
          // lint-test and build is the full drift check; this fails fast, offline, with a clear reason.
          const { existsSync, readFileSync } = require('node:fs');
          const path = require('node:path');

          const DEP_FIELDS = ['dependencies', 'devDependencies', 'optionalDependencies'];

          function sameMap(a = {}, b = {}) {
            const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
            return [...keys].filter((key) => a[key] !== b[key]).sort();
          }

          /** Returns {errors, warnings, skipped, packages} for the npm project in `dir`. */
          function check(dir) {
            const result = { errors: [], warnings: [], skipped: false, packages: 0 };
            if (!existsSync(path.join(dir, 'package.json'))) {
              result.skipped = true;
              return result;
            }
            const lockName = ['npm-shrinkwrap.json', 'package-lock.json'].find((name) => existsSync(path.join(dir, name)));
            if (lockName === undefined) {
              result.errors.push('package.json has no package-lock.json: run `npm install` and commit the lockfile');
              return result;
            }
            let manifest;
            let lock;
            try {
              manifest = JSON.parse(readFileSync(path.join(dir, 'package.json'), 'utf8'));
              lock = JSON.parse(readFileSync(path.join(dir, lockName), 'utf8'));
            } catch (error) {
              result.errors.push(`cannot parse package.json or ${lockName}: ${error.message}`);
              return result;
            }
            if (!Number.isInteger(lock.lockfileVersion) || lock.lockfileVersion < 2 || typeof lock.packages !== 'object' || lock.packages === null) {
              result.errors.push(`${lockName} is lockfileVersion ${lock.lockfileVersion}; regenerate it with npm 7 or later`);
              return result;
            }
            const root = lock.packages[''] ?? {};
            for (const field of DEP_FIELDS) {
              const drift = sameMap(manifest[field], root[field]);
              if (drift.length > 0) result.errors.push(`${lockName} is out of date with package.json ${field}: ${drift.join(', ')} (run \`npm install\`)`);
            }
            for (const [key, entry] of Object.entries(lock.packages)) {
              if (key === '' || entry === null || typeof entry !== 'object' || entry.link === true || entry.inBundle === true) continue;
              result.packages += 1;
              const resolved = entry.resolved;
              if (resolved === undefined) continue;
              if (typeof resolved !== 'string' || !resolved.startsWith('https://')) {
                result.errors.push(`${key} resolves to ${String(resolved).slice(0, 120)}: only https registry tarballs with an integrity hash are allowed`);
                continue;
              }
              if (typeof entry.integrity !== 'string' || entry.integrity === '') {
                result.errors.push(`${key} has no integrity hash`);
              } else if (!/(^|\s)sha512-/.test(entry.integrity)) {
                result.warnings.push(`${key} is pinned by ${entry.integrity.split('-')[0]} only (the registry publishes no sha512 for it)`);
              }
            }
            return result;
          }

          /** Escape a value for a workflow command: lockfile text is PR content and must not inject commands. */
          function escapeData(text) {
            return String(text).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          }

          function main(dir = process.cwd(), log = console.log) {
            const result = check(dir);
            if (result.skipped) {
              log('lockfile-check: no package.json here; not an npm project, nothing to check');
              return true;
            }
            for (const warning of result.warnings) log(`::warning title=lockfile::${escapeData(warning)}`);
            for (const error of result.errors) log(`::error title=lockfile::${escapeData(error)}`);
            log(`lockfile-check: ${result.packages} package(s), ${result.errors.length} error(s), ${result.warnings.length} warning(s)`);
            return result.errors.length === 0;
          }

          module.exports = { check, escapeData, main };

          if (require.main === module) {
            if (!main()) process.exitCode = 1;
          }
      - name: Commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: node {0}
        # embedded: pipeline/scripts/commitlint.cjs
        run: |
          'use strict';
          // pipeline/scripts/commitlint.cjs: Conventional Commits check for the commits a run would land.
          // Embedded byte for byte in pipeline.yml (shell: node {0}); pipeline/test checks that the two match.
          // pull_request: every commit in BASE_SHA..HEAD_SHA. The promoter squashes them, so merge commits are
          // skipped and git's autosquash and revert subjects are accepted. push (shadow candidate): HEAD_SHA only,
          // strictly; that commit's message is what lands on main. No dependencies.
          const { execFileSync } = require('node:child_process');

          const TYPES = ['build', 'chore', 'ci', 'docs', 'feat', 'fix', 'perf', 'refactor', 'revert', 'style', 'test'];
          const HEADER = /^([a-z]+)(\([a-z0-9][a-z0-9._/-]*\))?(!)?: (\S.*)$/;
          const MAX_HEADER = 100;
          const SQUASHED = /^(fixup|squash|amend)! |^Revert "/;
          const SHA = /^[0-9a-f]{40}$/;

          /** Problems with one commit message ([] when it conforms). `squashed` relaxes rules for commits the promoter squashes. */
          function lintMessage(message, { squashed = false } = {}) {
            const lines = String(message).replace(/\r\n/g, '\n').split('\n');
            const header = lines[0];
            if (squashed && SQUASHED.test(header)) return [];
            const problems = [];
            const match = HEADER.exec(header);
            if (match === null) {
              problems.push('header must be `type(scope)!: description`, e.g. `fix(api): reject empty body`');
            } else if (!TYPES.includes(match[1])) {
              problems.push(`type \`${match[1]}\` is not one of ${TYPES.join(', ')}`);
            }
            if (header.length > MAX_HEADER) problems.push(`header is ${header.length} characters; the limit is ${MAX_HEADER}`);
            if (lines.length > 1 && lines[1].trim() !== '') problems.push('leave a blank line between the header and the body');
            return problems;
          }

          /** Escape a value for a workflow command so commit text cannot inject commands or annotations. */
          function escapeData(text) {
            return String(text).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          }

          function readCommits(args, git) {
            const out = git(['log', '--no-color', '--format=%H%x1f%P%x1f%B%x1e', ...args]);
            return out.split('\x1e').map((entry) => entry.replace(/^\n/, '')).filter((entry) => entry !== '').map((entry) => {
              const [sha, parents, body] = entry.split('\x1f');
              return { sha, parents: parents.trim() === '' ? [] : parents.trim().split(' '), message: body.replace(/\n+$/, '') };
            });
          }

          function defaultGit(args) {
            return execFileSync('git', args, { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
          }

          function main(env = process.env, git = defaultGit, log = console.log) {
            const event = env.EVENT_NAME;
            const head = env.HEAD_SHA ?? '';
            if (!SHA.test(head)) throw new Error('HEAD_SHA must be 40 lowercase hex');
            let commits;
            let squashed;
            if (event === 'pull_request') {
              const base = env.BASE_SHA ?? '';
              if (!SHA.test(base)) throw new Error('BASE_SHA must be 40 lowercase hex on pull_request');
              commits = readCommits([`${base}..${head}`], git);
              squashed = true;
            } else if (event === 'push') {
              commits = readCommits(['-1', head], git);
              squashed = false;
            } else {
              throw new Error(`commitlint runs on pull_request or push, not ${event}`);
            }
            let failed = 0;
            let checked = 0;
            for (const commit of commits) {
              if (squashed && commit.parents.length > 1) continue;
              checked += 1;
              const problems = lintMessage(commit.message, { squashed });
              if (problems.length === 0) continue;
              failed += 1;
              const header = commit.message.split('\n')[0];
              log(`::error title=commit message ${commit.sha.slice(0, 12)}::${escapeData(`${problems.join('; ')} (header: ${header})`)}`);
            }
            log(`commitlint: ${checked} commit(s) checked, ${failed} failing`);
            if (failed > 0) {
              log(event === 'push'
                ? 'The candidate commit message comes from the pull request title: retitle the PR as `type(scope): description`.'
                : 'Reword with `git rebase -i` (reword) or a `fixup!` commit, then push.');
            }
            return failed === 0;
          }

          module.exports = { TYPES, MAX_HEADER, lintMessage, escapeData, readCommits, main };

          if (require.main === module) {
            try {
              if (!main()) process.exitCode = 1;
            } catch (error) {
              console.log(`::error title=commitlint::${escapeData(error.message)}`);
              process.exitCode = 1;
            }
          }

  security-assurance:
    # Stage 3: the intact security-assurance module, stage 0 admission then stage 2 analysis, final gate, signed
    # evidence bundle. A reusable workflow: its jobs report as `pipeline / security-assurance / <job>`, and the
    # `security` job below turns its decision into the `pipeline / security` check the authorizer reads.
    needs: config
    permissions:
      contents: read
      security-events: write # CodeQL results
      id-token: write # evidence-sign: keyless cosign signature of the evidence bundle
    uses: ./.github/workflows/security-assurance.yml
    with:
      depot_repository: susanbeasles/workflow_depot
      depot_ref: ${{ inputs.depot_ref }}
      policy_profile: ${{ needs.config.outputs.policy_profile }}

  security:
    name: security # stage 3 gate; the check name is `pipeline / security`; the authorizer requires it exactly
    needs: [config, security-assurance]
    # Runs even when security-assurance failed, so the check is red rather than skipped.
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: security-assurance final gate decision
        env:
          DECISION: ${{ needs.security-assurance.outputs.decision }}
          RESULT: ${{ needs.security-assurance.result }}
        run: |
          if [ "$DECISION" != PASS ]; then
            echo "::error title=security-assurance::final gate decision is '${DECISION:-none}' (job result: $RESULT); evidence: the security-evidence-<sha> artifact"
            exit 1
          fi
          echo "security-assurance: PASS (stage 0 admission, stage 2 analysis, signed evidence bundle)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Working directory stays inside the checkout
        working-directory: .
        env:
          WORKING_DIRECTORY: ${{ needs.config.outputs.working_directory }}
        shell: node {0}
        # embedded: pipeline/scripts/workdir-check.cjs
        run: |
          'use strict';
          // pipeline/scripts/workdir-check.cjs: the configured working directory must stay inside the checkout. Embedded byte
          // for byte in pipeline.yml (shell: node {0}); pipeline/test checks that the two match. Runs from the checkout root
          // right after checkout, before any step uses the directory. ci/pipeline-config.mjs only checks the path's spelling;
          // a tracked symlink in any component could still point outside the repository, so every component is lstat'ed
          // (no symlinks, directories only) and the resolved path must stay under the resolved checkout root.
          const { lstatSync, realpathSync } = require('node:fs');
          const path = require('node:path');

          const RELATIVE = /^[A-Za-z0-9._-]+(?:\/[A-Za-z0-9._-]+)*$/;

          class WorkdirError extends Error {}

          function check(root, dir) {
            if (dir === '.') return realpathSync(root);
            if (typeof dir !== 'string' || !RELATIVE.test(dir) || dir.split('/').some((s) => s === '.' || s === '..')) {
              throw new WorkdirError('WORKING_DIRECTORY must be . or a normalized relative path');
            }
            let current = root;
            for (const segment of dir.split('/')) {
              current = path.join(current, segment);
              let stat;
              try {
                stat = lstatSync(current);
              } catch {
                throw new WorkdirError(`${dir}: ${path.relative(root, current)} does not exist in the checkout`);
              }
              if (stat.isSymbolicLink()) throw new WorkdirError(`${dir}: ${path.relative(root, current)} is a symlink; the working directory must be a real directory inside the checkout`);
              if (!stat.isDirectory()) throw new WorkdirError(`${dir}: ${path.relative(root, current)} is not a directory`);
            }
            const realRoot = realpathSync(root);
            const resolved = realpathSync(current);
            if (resolved !== realRoot && !resolved.startsWith(`${realRoot}${path.sep}`)) throw new WorkdirError(`${dir} resolves outside the checkout`);
            return resolved;
          }

          module.exports = { WorkdirError, check };

          if (require.main === module) {
            try {
              check(process.cwd(), process.env.WORKING_DIRECTORY);
              console.log(`working directory ${process.env.WORKING_DIRECTORY} is inside the checkout`);
            } catch (error) {
              console.log(`::error title=working-directory::${error instanceof WorkdirError ? error.message : 'unexpected failure'}`);
              process.exitCode = 1;
            }
          }
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from security-assurance/policy/tool-registry.yml
          # (cross-checked there against the project's checksums file).
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/pipeline-bin"; work="$RUNNER_TEMP/pipeline-dl"; mkdir -p "$bin" "$work"; cd "$work"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir gitleaks && tar -xzf gitleaks.tgz -C gitleaks gitleaks
          install -m 0755 gitleaks/gitleaks "$bin/gitleaks"
          "$bin/gitleaks" version
      - name: gitleaks (checkout and commit range)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          gl="$RUNNER_TEMP/pipeline-bin/gitleaks"
          # The built-in rules, never the repository's .gitleaks.toml; findings are redacted in the log.
          cfg="$RUNNER_TEMP/gitleaks.toml"; printf '[extend]\nuseDefault = true\n' > "$cfg"
          ignore="$RUNNER_TEMP/gitleaks-ignore"; mkdir -p "$ignore"
          if [ -f .gitleaksignore ]; then
            echo "::warning title=gitleaks::.gitleaksignore suppresses $(grep -cvE '^[[:space:]]*(#|$)' .gitleaksignore || true) finding(s); review it in the diff"
          fi
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=gitleaks::head sha is malformed"; exit 1; }
          if [ "$EVENT_NAME" = pull_request ]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=gitleaks::base sha is malformed"; exit 1; }
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="$HEAD_SHA^..$HEAD_SHA"
          fi
          rc=0
          "$gl" dir --no-banner --redact --config "$cfg" --gitleaks-ignore-path "$ignore" . || rc=1
          "$gl" git --no-banner --redact --config "$cfg" --gitleaks-ignore-path "$ignore" --log-opts="$range" . || rc=1
          exit "$rc"
      - name: npm audit (production dependencies, high and critical)
        working-directory: ${{ needs.config.outputs.working_directory }}
        run: |
          if [ ! -f package.json ]; then echo "npm audit: no package.json here; skipped"; exit 0; fi
          # The public registry and the threshold are fixed here: a repository .npmrc cannot redirect or relax them.
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org/

  compile:
    # Stage 4, unprivileged half: install, the one production build, package and SBOM. Dependency lifecycle scripts
    # (pipeline.json `rebuild`) and the build script are repository code, so this job holds no OIDC token and no
    # attestation write; `build` attests what this job uploaded, without running any of it.
    needs: [config, lint-test, quality, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.package.outputs.artifact_digest }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    defaults:
      run:
        working-directory: ${{ needs.config.outputs.working_directory }}
    steps:
      - name: Stage 4 for terraform is terraform.plan in the runner (not wired)
        if: needs.config.outputs.ecosystem == 'terraform'
        working-directory: .
        env:
          PLAN: ${{ needs.config.outputs.terraform_plan }}
        run: |
          echo "::error title=build::stage 4 for terraform is '$PLAN' in the runner, requested from the authorizer with OIDC; workflow_depot has no action for that request yet. See docs/pipeline.md, open questions."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Working directory stays inside the checkout
        working-directory: .
        env:
          WORKING_DIRECTORY: ${{ needs.config.outputs.working_directory }}
        shell: node {0}
        # embedded: pipeline/scripts/workdir-check.cjs
        run: |
          'use strict';
          // pipeline/scripts/workdir-check.cjs: the configured working directory must stay inside the checkout. Embedded byte
          // for byte in pipeline.yml (shell: node {0}); pipeline/test checks that the two match. Runs from the checkout root
          // right after checkout, before any step uses the directory. ci/pipeline-config.mjs only checks the path's spelling;
          // a tracked symlink in any component could still point outside the repository, so every component is lstat'ed
          // (no symlinks, directories only) and the resolved path must stay under the resolved checkout root.
          const { lstatSync, realpathSync } = require('node:fs');
          const path = require('node:path');

          const RELATIVE = /^[A-Za-z0-9._-]+(?:\/[A-Za-z0-9._-]+)*$/;

          class WorkdirError extends Error {}

          function check(root, dir) {
            if (dir === '.') return realpathSync(root);
            if (typeof dir !== 'string' || !RELATIVE.test(dir) || dir.split('/').some((s) => s === '.' || s === '..')) {
              throw new WorkdirError('WORKING_DIRECTORY must be . or a normalized relative path');
            }
            let current = root;
            for (const segment of dir.split('/')) {
              current = path.join(current, segment);
              let stat;
              try {
                stat = lstatSync(current);
              } catch {
                throw new WorkdirError(`${dir}: ${path.relative(root, current)} does not exist in the checkout`);
              }
              if (stat.isSymbolicLink()) throw new WorkdirError(`${dir}: ${path.relative(root, current)} is a symlink; the working directory must be a real directory inside the checkout`);
              if (!stat.isDirectory()) throw new WorkdirError(`${dir}: ${path.relative(root, current)} is not a directory`);
            }
            const realRoot = realpathSync(root);
            const resolved = realpathSync(current);
            if (resolved !== realRoot && !resolved.startsWith(`${realRoot}${path.sep}`)) throw new WorkdirError(`${dir} resolves outside the checkout`);
            return resolved;
          }

          module.exports = { WorkdirError, check };

          if (require.main === module) {
            try {
              check(process.cwd(), process.env.WORKING_DIRECTORY);
              console.log(`working directory ${process.env.WORKING_DIRECTORY} is inside the checkout`);
            } catch (error) {
              console.log(`::error title=working-directory::${error instanceof WorkdirError ? error.message : 'unexpected failure'}`);
              process.exitCode = 1;
            }
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          # No dependency cache in the job that produces the attested artifact.
          package-manager-cache: false
      - name: Install
        env:
          REBUILD: ${{ needs.config.outputs.rebuild }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          read -r -a packages <<< "$REBUILD"
          if [ "${#packages[@]}" -gt 0 ]; then npm rebuild "${packages[@]}" --ignore-scripts=false --foreground-scripts; fi
      - name: Build (the one production build)
        env:
          SCRIPT: ${{ needs.config.outputs.script_build }}
        run: npm run "$SCRIPT"
      - name: Package
        id: package
        env:
          ARTIFACT_PATH: ${{ needs.config.outputs.output_directory }}
          OUT_DIR: ${{ runner.temp }}/pipeline-artifact
        shell: node {0}
        # embedded: pipeline/scripts/package.cjs
        run: |
          'use strict';
          // pipeline/scripts/package.cjs: package the build output deterministically and digest it.
          // Embedded byte for byte in pipeline.yml (shell: node {0}); pipeline/test checks that the two match.
          // ARTIFACT_PATH empty: `npm pack --ignore-scripts` (npm normalizes order and mtimes). A file: used as is.
          // A directory: GNU tar with sorted names, mtime 0, numeric owner 0 and normalized modes, then gzip with
          // mtime 0. Writes artifact_file, artifact_name and artifact_digest (sha256:<hex>) to GITHUB_OUTPUT.
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { appendFileSync, copyFileSync, existsSync, mkdirSync, readFileSync, realpathSync, statSync, writeFileSync } = require('node:fs');
          const path = require('node:path');
          const { gzipSync } = require('node:zlib');

          const SAFE_NAME = /^[A-Za-z0-9._@+-]+$/;

          class PackageError extends Error {}

          function digestFile(file) {
            return `sha256:${createHash('sha256').update(readFileSync(file)).digest('hex')}`;
          }

          function inside(parent, child) {
            const rel = path.relative(parent, child);
            return rel === '' || (!rel.startsWith('..') && !path.isAbsolute(rel));
          }

          function npmPack(cwd, outDir, run) {
            if (!existsSync(path.join(cwd, 'package.json'))) throw new PackageError('no package.json: set the `artifact-path` input to the file or directory to package');
            const out = run('npm', ['pack', '--ignore-scripts', '--json', '--pack-destination', outDir], { cwd, encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 });
            let filename;
            try {
              filename = JSON.parse(out)[0].filename;
            } catch {
              throw new PackageError('npm pack printed no JSON result');
            }
            if (typeof filename !== 'string') throw new PackageError('npm pack printed no filename');
            // Scoped packages are named scope-name-version.tgz; anything else is refused rather than guessed.
            const file = path.join(outDir, filename);
            if (!SAFE_NAME.test(filename) || !existsSync(file)) throw new PackageError(`npm pack output ${filename} not found`);
            return file;
          }

          function tarDirectory(dir, outDir, run) {
            const name = path.basename(dir);
            const tar = run('tar', [
              '--sort=name', '--mtime=@0', '--owner=0', '--group=0', '--numeric-owner', '--mode=u+rwX,go+rX,go-w',
              '--format=posix', '--pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime',
              '-C', path.dirname(dir), '-cf', '-', '--', name,
            ], { maxBuffer: 2 * 1024 * 1024 * 1024 });
            const file = path.join(outDir, `${name}.tar.gz`);
            writeFileSync(file, gzipSync(tar, { level: 9 }));
            return file;
          }

          function packageArtifact({ artifactPath = '', cwd = process.cwd(), workspace = cwd, outDir }, run = execFileSync) {
            if (!outDir) throw new PackageError('no output directory');
            mkdirSync(outDir, { recursive: true });
            let file;
            if (artifactPath.trim() === '') {
              file = npmPack(cwd, outDir, run);
            } else {
              const source = path.resolve(cwd, artifactPath);
              if (!existsSync(source)) throw new PackageError(`artifact-path ${artifactPath} does not exist after the build`);
              const real = realpathSync(source);
              if (!inside(realpathSync(workspace), real)) throw new PackageError(`artifact-path ${artifactPath} is outside the workspace`);
              const name = path.basename(real);
              if (!SAFE_NAME.test(name)) throw new PackageError(`artifact name ${name} must match ${SAFE_NAME}`);
              if (statSync(real).isDirectory()) {
                file = tarDirectory(real, outDir, run);
              } else {
                file = path.join(outDir, name);
                copyFileSync(real, file);
              }
            }
            return { artifact_file: file, artifact_name: path.basename(file), artifact_digest: digestFile(file) };
          }

          function main(env = process.env, log = console.log) {
            const result = packageArtifact({ artifactPath: env.ARTIFACT_PATH ?? '', cwd: process.cwd(), workspace: env.GITHUB_WORKSPACE || process.cwd(), outDir: env.OUT_DIR });
            if (env.GITHUB_OUTPUT) for (const [key, value] of Object.entries(result)) appendFileSync(env.GITHUB_OUTPUT, `${key}=${value}\n`);
            log(`packaged ${result.artifact_name} ${result.artifact_digest}`);
            return result;
          }

          module.exports = { PackageError, digestFile, packageArtifact, main };

          if (require.main === module) {
            try {
              main();
            } catch (error) {
              console.log(`::error title=package::${error instanceof PackageError ? error.message : `unexpected failure: ${error.message}`}`.replace(/[\r\n]+/g, ' '));
              process.exitCode = 1;
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-artifact
          path: ${{ steps.package.outputs.artifact_file }}
          if-no-files-found: error
          overwrite: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: susanbeasles/workflow_depot
          ref: ${{ inputs.depot_ref }}
          path: .workflow-depot
          persist-credentials: false
      - name: Materialize the security-assurance module for its qualified tool installer
        working-directory: .
        run: |
          set -euo pipefail
          mkdir .security-depot
          cp -a -- .workflow-depot/security-assurance/. .security-depot/
      - id: syft
        uses: ./.security-depot/.github/actions/install-tool
        with:
          tool: syft
      - name: SBOM (CycloneDX and SPDX) of the build output
        env:
          SYFT: ${{ steps.syft.outputs.bin }}
          OUTPUT_DIRECTORY: ${{ needs.config.outputs.output_directory }}
          SBOM_DIR: ${{ runner.temp }}/pipeline-sbom
        run: |
          set -euo pipefail
          mkdir -p "$SBOM_DIR"
          SYFT_CHECK_FOR_APP_UPDATE=false "$SYFT" scan "dir:$OUTPUT_DIRECTORY" \
            -o "cyclonedx-json=$SBOM_DIR/sbom.cdx.json" -o "spdx-json=$SBOM_DIR/sbom.spdx.json" \
            --source-name "$GITHUB_REPOSITORY" --source-version "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-sbom
          path: ${{ runner.temp }}/pipeline-sbom/
          if-no-files-found: error
          overwrite: true

  build:
    # Stage 4, privileged half. It runs no repository code: no checkout of the caller, no npm. It takes the artifact
    # `compile` uploaded, checks it against compile's digest, attests it and verifies the attestation. It runs
    # whenever config succeeded, so a failed compile makes this required check red, never skipped.
    name: build # stage 4; the check name is `pipeline / build`; the authorizer requires it exactly
    needs: [config, compile]
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the provenance attestation
      attestations: write # store the attestation for the artifact digest, and read it back to verify
    outputs:
      artifact_digest: ${{ steps.fetch.outputs.artifact_digest }}
    steps:
      - name: compile passed
        env:
          RESULT: ${{ needs.compile.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error title=build::compile (install, build, package, SBOM) finished '$RESULT'; nothing to attest"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pipeline-artifact
          path: ${{ runner.temp }}/pipeline-artifact
      - name: The downloaded artifact is the one compile packaged
        id: fetch
        env:
          ARTIFACT_NAME: ${{ needs.compile.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ needs.compile.outputs.artifact_digest }}
          DIR: ${{ runner.temp }}/pipeline-artifact
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error title=build::artifact name is malformed"; exit 1; }
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error title=build::artifact digest is malformed"; exit 1; }
          [ "$(find "$DIR" -mindepth 1 | wc -l)" = 1 ] || { echo "::error title=build::pipeline-artifact must hold exactly one file"; exit 1; }
          file="$DIR/$ARTIFACT_NAME"
          [ -f "$file" ] && [ ! -L "$file" ] || { echo "::error title=build::pipeline-artifact does not hold $ARTIFACT_NAME as a regular file"; exit 1; }
          actual="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
          [ "$actual" = "$ARTIFACT_DIGEST" ] || { echo "::error title=build::artifact digest $actual differs from compile's $ARTIFACT_DIGEST"; exit 1; }
          { echo "artifact_file=$file"; echo "artifact_digest=$actual"; } >> "$GITHUB_OUTPUT"
          echo "artifact $ARTIFACT_NAME $actual"
      - if: inputs.require-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.fetch.outputs.artifact_file }}
      - name: Verify the attestation (gh attestation verify)
        if: inputs.require-attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_FILE: ${{ steps.fetch.outputs.artifact_file }}
          DEPOT_REF: ${{ inputs.depot_ref }}
        run: |
          set -euo pipefail
          gh attestation verify "$ARTIFACT_FILE" --repo "$GITHUB_REPOSITORY" --deny-self-hosted-runners \
            --cert-identity "https://github.com/susanbeasles/workflow_depot/.github/workflows/pipeline.yml@$DEPOT_REF" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com

  shadow:
    name: shadow # stage 5 (pull request); the check name is `pipeline / shadow`; the authorizer requires it exactly
    # Non-draft pull requests from this repository into main. Drafts run every stage but never ask for a
    # candidate; marking the PR ready (caller: `ready_for_review`) starts the run that does.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC token for the routing claim and for the authorizer; nothing else
    outputs:
      candidate_sha: ${{ steps.request.outputs.candidate_sha }}
    steps:
      - name: Find the workflow_depot commit this pipeline runs at
        id: route
        shell: node {0}
        # embedded: pipeline/scripts/workflow-sha.cjs
        run: |
          'use strict';
          // pipeline/scripts/workflow-sha.cjs: find the workflow_depot commit this reusable workflow runs at.
          // Embedded byte for byte in pipeline.yml (shell: node {0}); pipeline/test checks that the two match.
          // It reads this job's OIDC token, decodes the job_workflow_sha claim and writes `sha=<40 hex>` to
          // GITHUB_OUTPUT. The signature is not checked: this only picks which commit to check out, and the
          // authorizer verifies its own token. The token's audience is accepted by no service, so a leaked
          // token is worthless. The token is never printed.
          const { appendFileSync } = require('node:fs');

          const AUDIENCE = 'workflow-depot-route';
          const WORKFLOW = 'susanbeasles/workflow_depot/.github/workflows/pipeline.yml@';
          const SHA = /^[0-9a-f]{40}$/;

          class RouteError extends Error {}

          function decodeClaims(jwt) {
            const parts = typeof jwt === 'string' ? jwt.split('.') : [];
            if (parts.length !== 3 || !/^[A-Za-z0-9_-]+$/.test(parts[1])) throw new RouteError('OIDC token is not a JWT');
            let claims;
            try {
              claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            } catch {
              throw new RouteError('OIDC token payload is not JSON');
            }
            if (claims === null || typeof claims !== 'object' || Array.isArray(claims)) throw new RouteError('OIDC token payload is not an object');
            return claims;
          }

          function workflowSha(claims) {
            const ref = claims.job_workflow_ref;
            if (typeof ref !== 'string' || !ref.startsWith(WORKFLOW) || ref.length === WORKFLOW.length) {
              throw new RouteError('job_workflow_ref is not susanbeasles/workflow_depot pipeline.yml: run this job only inside the reusable pipeline');
            }
            const sha = claims.job_workflow_sha;
            if (typeof sha !== 'string' || !SHA.test(sha)) throw new RouteError('job_workflow_sha is missing or not 40 lowercase hex');
            return sha;
          }

          async function oidcToken(env, fetchImpl) {
            const url = env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const bearer = env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!url || !bearer) throw new RouteError('no OIDC token available: the job needs `permissions: id-token: write`');
            const target = new URL(url);
            target.searchParams.set('audience', AUDIENCE);
            const res = await fetchImpl(target, { headers: { authorization: `bearer ${bearer}` }, redirect: 'error', signal: AbortSignal.timeout(15000) });
            if (res.status !== 200) throw new RouteError(`OIDC token request failed with ${res.status}`);
            const text = await res.text();
            if (text.length > 16384) throw new RouteError('OIDC token response too large');
            let value;
            try {
              value = JSON.parse(text).value;
            } catch {
              throw new RouteError('OIDC token response is not JSON');
            }
            if (typeof value !== 'string') throw new RouteError('OIDC token response has no token');
            return value;
          }

          async function main(env = process.env, fetchImpl = fetch, log = console.log) {
            const sha = workflowSha(decodeClaims(await oidcToken(env, fetchImpl)));
            if (env.GITHUB_OUTPUT) appendFileSync(env.GITHUB_OUTPUT, `sha=${sha}\n`);
            log(`workflow_depot pipeline.yml runs at ${sha}`);
            return sha;
          }

          module.exports = { AUDIENCE, WORKFLOW, RouteError, decodeClaims, workflowSha, oidcToken, main };

          if (require.main === module) {
            main().catch((error) => {
              console.log(`::error title=workflow-sha::${error instanceof RouteError ? error.message : 'unexpected failure'}`);
              process.exitCode = 1;
            });
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: susanbeasles/workflow_depot
          ref: ${{ steps.route.outputs.sha }}
          path: .workflow-depot
          persist-credentials: false
      - name: Ask the authorizer for the shadow candidate
        id: request
        env:
          DEPOT_SHA: ${{ steps.route.outputs.sha }}
        run: |
          test "$(git -C .workflow-depot rev-parse HEAD)" = "$DEPOT_SHA"
          node .workflow-depot/actions/request-shadow/main.mjs

  promote:
    name: promote # stage 5 (candidate); the check name is `pipeline / promote`; the authorizer requires it exactly
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/shadow/pr-')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC token for the routing claim and for the authorizer; nothing else
    outputs:
      outcome: ${{ steps.request.outputs.outcome }}
      main_sha: ${{ steps.request.outputs.main_sha }}
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - name: Find the workflow_depot commit this pipeline runs at
        id: route
        shell: node {0}
        # embedded: pipeline/scripts/workflow-sha.cjs
        run: |
          'use strict';
          // pipeline/scripts/workflow-sha.cjs: find the workflow_depot commit this reusable workflow runs at.
          // Embedded byte for byte in pipeline.yml (shell: node {0}); pipeline/test checks that the two match.
          // It reads this job's OIDC token, decodes the job_workflow_sha claim and writes `sha=<40 hex>` to
          // GITHUB_OUTPUT. The signature is not checked: this only picks which commit to check out, and the
          // authorizer verifies its own token. The token's audience is accepted by no service, so a leaked
          // token is worthless. The token is never printed.
          const { appendFileSync } = require('node:fs');

          const AUDIENCE = 'workflow-depot-route';
          const WORKFLOW = 'susanbeasles/workflow_depot/.github/workflows/pipeline.yml@';
          const SHA = /^[0-9a-f]{40}$/;

          class RouteError extends Error {}

          function decodeClaims(jwt) {
            const parts = typeof jwt === 'string' ? jwt.split('.') : [];
            if (parts.length !== 3 || !/^[A-Za-z0-9_-]+$/.test(parts[1])) throw new RouteError('OIDC token is not a JWT');
            let claims;
            try {
              claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            } catch {
              throw new RouteError('OIDC token payload is not JSON');
            }
            if (claims === null || typeof claims !== 'object' || Array.isArray(claims)) throw new RouteError('OIDC token payload is not an object');
            return claims;
          }

          function workflowSha(claims) {
            const ref = claims.job_workflow_ref;
            if (typeof ref !== 'string' || !ref.startsWith(WORKFLOW) || ref.length === WORKFLOW.length) {
              throw new RouteError('job_workflow_ref is not susanbeasles/workflow_depot pipeline.yml: run this job only inside the reusable pipeline');
            }
            const sha = claims.job_workflow_sha;
            if (typeof sha !== 'string' || !SHA.test(sha)) throw new RouteError('job_workflow_sha is missing or not 40 lowercase hex');
            return sha;
          }

          async function oidcToken(env, fetchImpl) {
            const url = env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const bearer = env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!url || !bearer) throw new RouteError('no OIDC token available: the job needs `permissions: id-token: write`');
            const target = new URL(url);
            target.searchParams.set('audience', AUDIENCE);
            const res = await fetchImpl(target, { headers: { authorization: `bearer ${bearer}` }, redirect: 'error', signal: AbortSignal.timeout(15000) });
            if (res.status !== 200) throw new RouteError(`OIDC token request failed with ${res.status}`);
            const text = await res.text();
            if (text.length > 16384) throw new RouteError('OIDC token response too large');
            let value;
            try {
              value = JSON.parse(text).value;
            } catch {
              throw new RouteError('OIDC token response is not JSON');
            }
            if (typeof value !== 'string') throw new RouteError('OIDC token response has no token');
            return value;
          }

          async function main(env = process.env, fetchImpl = fetch, log = console.log) {
            const sha = workflowSha(decodeClaims(await oidcToken(env, fetchImpl)));
            if (env.GITHUB_OUTPUT) appendFileSync(env.GITHUB_OUTPUT, `sha=${sha}\n`);
            log(`workflow_depot pipeline.yml runs at ${sha}`);
            return sha;
          }

          module.exports = { AUDIENCE, WORKFLOW, RouteError, decodeClaims, workflowSha, oidcToken, main };

          if (require.main === module) {
            main().catch((error) => {
              console.log(`::error title=workflow-sha::${error instanceof RouteError ? error.message : 'unexpected failure'}`);
              process.exitCode = 1;
            });
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: susanbeasles/workflow_depot
          ref: ${{ steps.route.outputs.sha }}
          path: .workflow-depot
          persist-credentials: false
      - name: Ask the authorizer to promote this candidate
        id: request
        env:
          DEPOT_SHA: ${{ steps.route.outputs.sha }}
          INPUT_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          test "$(git -C .workflow-depot rev-parse HEAD)" = "$DEPOT_SHA"
          node .workflow-depot/actions/request-promotion/main.mjs

  release:
    # Stage 6, only on main and on vX.Y.Z tags, after stages 1 to 4 passed on this exact commit. The universal
    # release workflow at this same commit; depot_ref is its signing identity (release.yml@<depot_ref>).
    needs: [config, build]
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.config.outputs.release == 'true'
    permissions:
      contents: write # publish job: the write-once GitHub Release
      id-token: write # attest job: keyless signing
      attestations: write # attest job: build provenance
    uses: ./.github/workflows/release.yml
    with:
      depot_ref: ${{ inputs.depot_ref }}
      application_manifest: ${{ needs.config.outputs.application_manifest }}

  deploy:
    # Stage 7, only after stage 6 published a release on main. Spec 5.2/5.4: a deployment is requested from the
    # authorizer with this run's OIDC token; a dispatch PAT is forbidden. workflow_depot has no action for that
    # request yet (the request format lives in the authorizer), so a repository that lists deploy targets gets a
    # red stage 7 with this reason instead of a PAT path. Repositories without deploy targets skip it.
    needs: [config, release]
    if: github.ref == 'refs/heads/main' && needs.release.outputs.released == 'true' && needs.config.outputs.deploy_targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: deploy request to the authorizer (not wired)
        env:
          TARGETS: ${{ needs.config.outputs.deploy_targets }}
        run: |
          echo "::error title=deploy::stage 7 for $TARGETS is an OIDC deploy request to the authorizer; workflow_depot has no action for that request yet, and the PAT dispatch (request-deployment.yml) is forbidden by spec 5.2/5.4. The release is published; see docs/pipeline.md, open questions."
          exit 1

  infra-apply:
    name: infra-apply # stage 7 for terraform repositories: terraform.apply or root.apply in the runner
    needs: [config, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.config.outputs.ecosystem == 'terraform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: terraform.apply or root.apply request (not wired)
        env:
          APPLY: ${{ needs.config.outputs.terraform_apply }}
        run: |
          echo "::error title=infra-apply::stage 7 for terraform is '$APPLY' in the runner, requested from the authorizer with OIDC; workflow_depot has no action for that request yet. See docs/pipeline.md, open questions."
          exit 1
